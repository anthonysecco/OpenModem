# openmodem.conf — OpenModem application configuration
#
# Sourced by bin/*.sh at startup. Keys use shell variable syntax:
# KEY=value (no spaces around =). Changes take effect on next service
# restart.

# ── Logging ──────────────────────────────────────────────────────────────
# LOG_LEVEL controls verbosity for daemons.
#   0 = errors only
#   1 = operational  ← default
#   2 = debug (every AT command and response)
LOG_LEVEL=1

# ── AT command device ────────────────────────────────────────────────────
# Raw character device for AT commands on the RM520N-GL. Confirm the
# correct node for the target firmware before relying on this.
AT_DEVICE=/dev/smd11

# ── Poll interval (seconds) ───────────────────────────────────────────────
# A single interval, not tiered — see SCOPE.md for what's actually polled
# and why multiple tiers weren't worth the complexity here.
#
# 5s (down from the original 10s default) since at_poller.sh now chains
# every cycle's AT commands into a single broker round trip instead of
# issuing them one at a time — cycle time dropped from ~9s to ~1-3s
# (confirmed live), leaving comfortable margin at 5s.
POLL_INTERVAL=5

# ── TTL / hop-limit spoofing ─────────────────────────────────────────────
# 0 = disabled. Set via the WAN page, not by hand — www/cgi-bin/
# wan_action.sh's set_ttl writes this key, and bin/apply_iptables.sh
# reads it to re-apply the iptables/ip6tables rule after a reboot.
TTL_VALUE=0

# ── Connectivity Check (bin/net_poller.sh) ──────────────────────────────
# Independent of POLL_INTERVAL above — see net_poller.sh's header for why
# it's a separate daemon from at_poller.sh.
#
# ICMP: one ping per NET_ICMP_INTERVAL seconds against NET_ICMP_TARGET, a
# rolling average kept over the last NET_ICMP_WINDOW samples.
NET_ICMP_TARGET=1.1.1.1
NET_ICMP_INTERVAL=5
NET_ICMP_WINDOW=6

# HTTP 204 check against Google's connectivitycheck endpoint. Adaptive
# interval: NET_CHECK204_HEALTHY_INTERVAL while succeeding, drops to
# NET_CHECK204_RETRY_INTERVAL on the first miss, then doubles on each
# further consecutive failure up to a ceiling of
# NET_CHECK204_HEALTHY_INTERVAL. NET_CHECK204_RECOVER_SUCCESSES
# consecutive successes are required before declaring recovery.
NET_CHECK204_URL=http://connectivitycheck.gstatic.com/generate_204
NET_CHECK204_HEALTHY_INTERVAL=60
NET_CHECK204_RETRY_INTERVAL=10
NET_CHECK204_RECOVER_SUCCESSES=2

# Cloudflare PoP (colo) + IP geolocation (city/region via ipinfo.io) —
# both change rarely, so this is on its own much slower interval than
# the checks above rather than adding load to third-party services for
# no benefit.
NET_GEO_TRACE_URL=https://1.1.1.1/cdn-cgi/trace
NET_GEO_IPINFO_URL=https://ipinfo.io/json
NET_GEO_INTERVAL=300

# ── MIMO max-observed cache (bin/at_poller.sh) ───────────────────────────
# The "Est. Speed" throughput math (compute_ca_throughput) uses, per
# component carrier, the highest MIMO layer count observed on that exact
# carrier (keyed by PCI+EARFCN) within a trailing rolling window, rather
# than either the live reading (too bouncy — drops to 1-2 whenever the
# link is idle) or a static per-band capability ceiling (optimistic —
# many real sites run 2x2 on a band the modem supports up to 4x4 on).
# MIMO_MAX_WINDOW_S is that window's width: a sample older than this is
# dropped from the max, so a peak fades out this long after it was last
# observed even on a carrier that's continuously connected — not just an
# absence timeout. A carrier that drops out of the live reading entirely
# (idle SCC, brief handover to a neighbor cell) keeps its last-observed
# max for the same duration, so a return to the same cell within the
# window doesn't lose it. 300s = 5 minutes.
MIMO_MAX_WINDOW_S=300

# ── History ring buffer (bin/at_poller.sh, bin/net_poller.sh) ───────────
# Shared window size, in samples, for both pollers' 5-minute trend history
# files (history_signal.json / history_net.json / history_wan.json, the
# last also written by at_poller.sh) — kept as one constant, read by both
# scripts, so they stay in sync if either poller's own interval
# (POLL_INTERVAL / NET_ICMP_INTERVAL, both 5s by default) ever changes.
# 60 samples * 5s = 300s = 5 minutes.
HISTORY_WINDOW_SAMPLES=60
