<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem — SIM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
    <span id="om-conn-status">Loading…</span>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-cards">
      <div class="om-card"><h2>SIM Status</h2><p data-field="sim_status">—</p></div>
      <div class="om-card"><h2>ICCID</h2><p data-field="sim_iccid">—</p></div>
      <div class="om-card"><h2>IMSI</h2><p data-field="sim_imsi">—</p></div>
    </div>
    <p class="om-updated">Updated <span data-field="_polled_at">—</span></p>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('sim');</script>
</body>
</html>
