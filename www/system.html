<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem — System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
    <span id="om-conn-status">Loading…</span>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-cards">
      <div class="om-card">
        <h2>Device Info</h2>
        <div class="om-row"><span class="om-row-label">Model</span><span data-field="device_model">—</span></div>
        <div class="om-row"><span class="om-row-label">IMEI</span><span data-field="device_imei">—</span></div>
        <div class="om-row"><span class="om-row-label">Firmware</span><span data-field="device_firmware">—</span></div>
      </div>
      <div class="om-card om-card-wide">
        <h2>AT Terminal</h2>
        <div id="om-term-log" class="om-term-log"></div>
        <div class="om-term-input-row">
          <input id="om-term-input" type="text" placeholder="AT+..." autocomplete="off" spellcheck="false">
          <button id="om-term-send" type="button">Send</button>
        </div>
      </div>
      <div class="om-card">
        <h2>Power</h2>
        <div class="om-button-stack">
          <button type="button" data-power-action="reboot">Reboot</button>
          <button type="button" data-power-action="radio_off">Radio Off</button>
          <button type="button" data-power-action="radio_on">Radio On</button>
        </div>
      </div>
      <div class="om-card">
        <h2>Update</h2>
        <p id="om-update-status">Reinstalls the latest OpenModem from GitHub.</p>
        <button id="om-update-btn" type="button">Check for Update / Install Latest</button>
      </div>
    </div>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('system');</script>
</body>
</html>
