<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem — System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-cards">
      <div class="om-card">
        <h2>Device Info</h2>
        <div class="om-row"><span class="om-row-label">Model</span><span data-field="device_model">—</span></div>
        <div class="om-row"><span class="om-row-label">IMEI</span><span data-field="device_imei">—</span></div>
        <div class="om-row"><span class="om-row-label">Firmware</span><span data-field="device_firmware">—</span></div>
        <div class="om-row"><span class="om-row-label">Uptime</span><span data-field="device_uptime_s">—</span></div>
      </div>
      <div class="om-card">
        <h2>Power</h2>
        <div class="om-button-stack">
          <button type="button" data-power-action="reboot">Reboot</button>
          <button type="button" data-power-action="radio_off">Radio Off</button>
          <button type="button" data-power-action="radio_on">Radio On</button>
        </div>
      </div>
      <div class="om-card">
        <h2>Update</h2>
        <p id="om-update-status">Reinstalls the latest OpenModem from GitHub.</p>
        <button id="om-update-btn" type="button">Check for Update / Install Latest</button>
      </div>
      <div class="om-card om-card-wide">
        <div class="om-term-header">
          <h2 style="margin:0;">AT Terminal</h2>
          <div class="om-term-header-btns">
            <button id="om-term-clear" type="button">Clear</button>
            <button id="om-term-export" type="button">Export Log</button>
          </div>
        </div>
        <div class="om-terminal">
          <div class="om-term-bar">
            <span class="om-term-dot red"></span>
            <span class="om-term-dot yellow"></span>
            <span class="om-term-dot green"></span>
            <span class="om-term-title">AT Terminal — RM520N-GL</span>
          </div>
          <div id="om-term-log" class="om-term-log"></div>
          <div id="om-term-presets" class="om-term-presets"></div>
          <div class="om-term-input-row">
            <span class="om-term-prefix">AT&gt;</span>
            <input id="om-term-input" type="text" placeholder="Enter AT command and press Enter…" autocomplete="off" spellcheck="false">
            <button id="om-term-send" type="button">Send</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="om-footer" id="om-footer"></footer>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('system');</script>
</body>
</html>
