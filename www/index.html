<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
    <div class="om-topbar-signal" id="om-topbar-signal"></div>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-cards">
      <div class="om-card">
        <h2>Signal</h2>
        <div class="om-row"><span class="om-row-label">RSRP</span><span data-field="signal_lte_rsrp">—</span></div>
        <div class="om-row"><span class="om-row-label">RSRQ</span><span data-field="signal_lte_rsrq">—</span></div>
        <div class="om-row"><span class="om-row-label">SINR</span><span data-field="signal_lte_sinr">—</span></div>
      </div>
      <div class="om-card om-card-wide">
        <h2>Signal Strength</h2>
        <div class="om-sig-final">
          <div class="om-sig-bars" id="om-sig-combo-bars"></div>
          <div id="om-sig-combo-word"></div>
        </div>
      </div>
      <div class="om-card">
        <h2>Carrier</h2>
        <div class="om-row"><span class="om-row-label">Name</span><span data-field="carrier_name">—</span></div>
        <div class="om-row"><span class="om-row-label">Type</span><span data-field="cell_rat">—</span></div>
        <div class="om-row"><span class="om-row-label">Band</span><span data-field="cell_band">—</span></div>
      </div>
      <div class="om-card">
        <h2>Connectivity</h2>
        <div class="om-row"><span class="om-row-label">Connectivity Check</span><span class="om-row-value-wrap"><span id="om-conn-check204-text">—</span><span class="om-ring-dot" id="om-conn-check204-dot"></span></span></div>
        <div class="om-row"><span class="om-row-label">Ping Check</span><span class="om-row-value-wrap"><span id="om-conn-icmp-status-text">—</span><span class="om-ring-dot" id="om-conn-icmp-dot"></span></span></div>
        <div class="om-row"><span class="om-row-label">Latency</span><span class="om-row-value-wrap"><span id="om-conn-icmp-latency-text">—</span><span class="om-ring-dot" id="om-conn-icmp-latency-dot"></span></span></div>
        <div class="om-row"><span class="om-row-label">Jitter</span><span class="om-row-value-wrap"><span id="om-conn-icmp-jitter-text">—</span><span class="om-ring-dot" id="om-conn-icmp-jitter-dot"></span></span></div>
      </div>
      <div class="om-card">
        <h2><span>RSRP Trend (5 min)</span><span class="om-card-title-value">dBm</span></h2>
        <div class="om-chart-wrap">
          <span class="om-chart-axis om-chart-axis-max">-75</span>
          <span class="om-chart-axis om-chart-axis-min">-140</span>
          <svg class="om-chart-svg" id="om-hist-rsrp-chart"></svg>
          <div class="om-chart-tooltip" id="om-hist-rsrp-chart-tooltip"></div>
        </div>
      </div>
      <div class="om-card om-card-wide">
        <h2>Latency / Jitter Trend (5 min)</h2>
        <div class="om-spark-label">Latency</div>
        <div class="om-spark" id="om-hist-latency-spark"></div>
        <div class="om-spark-label">Jitter</div>
        <div class="om-spark" id="om-hist-jitter-spark"></div>
      </div>
      <div class="om-card">
        <h2>SIM</h2>
        <p data-field="sim_status">—</p>
      </div>
      <div class="om-card">
        <h2>WAN</h2>
        <div class="om-row"><span class="om-row-label">Status</span><span data-field="wan_active">—</span></div>
        <div class="om-row"><span class="om-row-label">IP</span><span data-field="wan_ip">—</span></div>
      </div>
    </div>
    <footer class="om-footer" id="om-footer"></footer>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('dashboard');</script>
</body>
</html>
