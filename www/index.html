<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
    <div class="om-topbar-signal" id="om-topbar-signal"></div>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-cards">
      <div class="om-card om-dash-signal-card">
        <h2>Signal</h2>
        <div class="om-sig-final">
          <div class="om-sig-bars" id="om-sig-combo-bars"></div>
          <div id="om-sig-combo-word"></div>
          <div class="om-sig-meta">
            <span id="om-sig-carrier-name">—</span>
            <span class="om-sig-meta-sep">·</span>
            <span id="om-sig-network-type">—</span>
          </div>
        </div>
      </div>
      <div class="om-card om-status-card">
        <h2>Status</h2>
        <div class="om-status-final">
          <span class="om-status-icon" id="om-status-icon"></span>
          <div class="om-status-word" id="om-status-title">—</div>
          <div class="om-status-detail" id="om-status-detail">Checking modem status…</div>
        </div>
      </div>
      <div class="om-card">
        <h2>Network</h2>
        <div class="om-row"><span class="om-row-label">LTE Status</span><span class="om-row-value-wrap"><span data-field="reg_lte">—</span><span class="om-ring-dot" data-ring="reg_lte"></span></span></div>
        <div class="om-row"><span class="om-row-label">5G NR Status</span><span class="om-row-value-wrap"><span data-field="reg_nr">—</span><span class="om-ring-dot" data-ring="reg_nr"></span></span></div>
        <div class="om-row"><span class="om-row-label">Roaming</span><span id="om-net-roaming">—</span></div>
        <div class="om-row"><span class="om-row-label om-hint" title="Public Land Mobile Network ID — identifies your carrier's network (country code + operator code).">PLMN</span><span data-field="carrier_plmn">—</span></div>
      </div>
      <div class="om-card">
        <h2>Connectivity</h2>
        <div class="om-row"><span class="om-row-label">Connectivity Check</span><span class="om-row-value-wrap"><span id="om-conn-check204-text">—</span><span class="om-ring-dot" id="om-conn-check204-dot"></span></span></div>
        <div class="om-row"><span class="om-row-label">Ping Check</span><span class="om-row-value-wrap"><span id="om-conn-icmp-status-text">—</span><span class="om-ring-dot" id="om-conn-icmp-dot"></span></span></div>
        <div class="om-row"><span class="om-row-label om-hint" title="Which Cloudflare data center answered the connectivity check — useful for diagnosing routing, not something you need to act on.">Cloudflare PoP</span><span id="om-conn-cf-pop">—</span></div>
        <div class="om-row"><span class="om-row-label">IP Geo</span><span id="om-conn-geo-location">—</span></div>
      </div>
      <div class="om-card om-card-wide">
        <h2>Trends (5 min)</h2>

        <div class="om-hero-label">Signal (dBm)</div>
        <div class="om-hero-value" id="om-hist-rsrp-chart-latest">—</div>
        <div class="om-chart-wrap">
          <span class="om-chart-axis om-chart-axis-max">-75</span>
          <span class="om-chart-axis om-chart-axis-min">-140</span>
          <svg class="om-chart-svg" id="om-hist-rsrp-chart"></svg>
          <div class="om-chart-tooltip" id="om-hist-rsrp-chart-tooltip"></div>
        </div>

        <div class="om-hero-label">Est. Speed (Mbps)</div>
        <div class="om-hero-value" id="om-hist-speed-chart-latest">—</div>
        <div class="om-chart-wrap">
          <span class="om-chart-axis om-chart-axis-max">250</span>
          <span class="om-chart-axis om-chart-axis-min">0</span>
          <svg class="om-chart-svg" id="om-hist-speed-chart"></svg>
          <div class="om-chart-tooltip" id="om-hist-speed-chart-tooltip"></div>
        </div>

        <div class="om-hero-label">Latency (ms)</div>
        <div class="om-hero-value" id="om-hist-latency-chart-latest">—</div>
        <div class="om-chart-wrap">
          <span class="om-chart-axis om-chart-axis-max">250</span>
          <span class="om-chart-axis om-chart-axis-min">0</span>
          <svg class="om-chart-svg" id="om-hist-latency-chart"></svg>
          <div class="om-chart-tooltip" id="om-hist-latency-chart-tooltip"></div>
        </div>

        <div class="om-hero-label">Jitter (ms)</div>
        <div class="om-hero-value" id="om-hist-jitter-chart-latest">—</div>
        <div class="om-chart-wrap">
          <span class="om-chart-axis om-chart-axis-max">50</span>
          <span class="om-chart-axis om-chart-axis-min">0</span>
          <svg class="om-chart-svg" id="om-hist-jitter-chart"></svg>
          <div class="om-chart-tooltip" id="om-hist-jitter-chart-tooltip"></div>
        </div>
      </div>
    </div>
    <footer class="om-footer" id="om-footer"></footer>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('dashboard');</script>
</body>
</html>
