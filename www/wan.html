<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenModem — WAN</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="om-topbar">
    <span class="device-name">OpenModem</span>
    <span id="om-conn-status">Loading…</span>
  </header>

  <nav class="om-sidebar" id="om-sidebar-nav"></nav>

  <main class="om-main">
    <div class="om-apply-bar" id="om-apply-bar" style="display:none;">
      <span class="om-apply-bar-label">You have unsaved changes.</span>
      <button id="om-apply-btn" type="button">Apply Changes</button>
      <span id="om-apply-status" class="om-note"></span>
    </div>
    <div class="om-cards">
      <div class="om-card">
        <h2>Status</h2>
        <div class="om-row"><span class="om-row-label">State</span><span data-field="wan_active">—</span></div>
        <div class="om-row"><span class="om-row-label">APN</span><span data-field="wan_apn">—</span></div>
        <div class="om-row"><span class="om-row-label">IP Type</span><span data-field="wan_ip_type">—</span></div>
        <div class="om-row"><span class="om-row-label">IPv4</span><span data-field="wan_ip">—</span></div>
        <div class="om-row"><span class="om-row-label">IPv6</span><span data-field="wan_ipv6">—</span></div>
      </div>

      <div class="om-card">
        <h2>Internet</h2>
        <div class="om-row"><span class="om-row-label">ISP</span><span id="om-wan-inet-isp">—</span></div>
        <div class="om-row"><span class="om-row-label">ASN</span><span id="om-wan-inet-asn">—</span></div>
        <div class="om-row"><span class="om-row-label">Hostname</span><span id="om-wan-inet-hostname">—</span></div>
        <div class="om-row"><span class="om-row-label">IPv4</span><span id="om-wan-inet-ipv4">—</span></div>
        <div class="om-row"><span class="om-row-label">IPv6</span><span id="om-wan-inet-ipv6">—</span></div>
        <div class="om-row"><span class="om-row-label">Location</span><span id="om-wan-inet-geo">—</span></div>
        <p id="om-wan-inet-status" class="om-note"></p>
      </div>

      <div class="om-card">
        <h2>Data Usage</h2>
        <div class="om-row"><span class="om-row-label">Received</span><span data-field="wan_data_rx">—</span></div>
        <div class="om-row"><span class="om-row-label">Sent</span><span data-field="wan_data_tx">—</span></div>
        <p class="om-note">Cumulative since last reset or module boot.</p>
        <button id="om-wan-reset-counter" type="button">Reset Counter</button>
        <p id="om-wan-reset-status" class="om-note"></p>
      </div>

      <div class="om-card">
        <h2>TTL Spoofing</h2>
        <div class="om-ttl-carriers">
          <span class="om-ttl-carrier"><span class="om-ttl-swatch" style="background:#00A8E0"></span>AT&amp;T (Blue) — 65</span>
          <span class="om-ttl-carrier"><span class="om-ttl-swatch" style="background:#E20074"></span>T-Mobile (Magenta) — 65</span>
          <span class="om-ttl-carrier"><span class="om-ttl-swatch" style="background:#EE0000"></span>Verizon (Red) — 88</span>
        </div>
        <div class="om-form-row">
          <label for="om-wan-ttl">TTL / Hop Limit (0 = disabled, 1–255)</label>
          <input type="number" id="om-wan-ttl" min="0" max="255" placeholder="0">
        </div>
      </div>
    </div>
    <p class="om-updated">Updated <span data-field="_polled_at">—</span></p>
  </main>

  <nav class="om-tabbar" id="om-tabbar-nav"></nav>

  <script src="/app.js"></script>
  <script>OM.init('wan');</script>
</body>
</html>
